# CI for your Skill Atlas repository: the typecheck, the tests, the CLI itself and the UI e2e tests, on every push
# and pull request, on a clean machine. A pull request is ready when this is green.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The real CLI on the fixture repository, as a user would run it: it must exit 0.
      - name: Smoke test
        run: |
          ./skill-atlas help
          ./skill-atlas scan ./fixture
      # The web view on the fixture repository: the page must list its skills.
      - name: Smoke test, web view
        run: |
          ./skill-atlas serve --port 4321 &
          for i in $(seq 50); do curl -fs -o /dev/null http://127.0.0.1:4321/ && break; sleep 0.1; done
          curl -fsS 'http://127.0.0.1:4321/?repo=./fixture' | grep -F 'fixture</a> · 4 skills'
          kill %1
  # The UI e2e tests, in the image of tests/e2e/Dockerfile (scripts/e2e.sh): the screenshots of the key
  # moments must match tests/e2e/screenshots/ to the pixel. Every run keeps its recordings.
  e2e:
    runs-on: ubuntu-latest
    # A cold build of the image alone takes about 11 minutes (its packages come from snapshot.ubuntu.com).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The image, built once per tag and kept in the Actions cache: only a Playwright update or an edit
      # to the Dockerfile pays the cold build. On a hit, scripts/e2e.sh finds the loaded image and skips it.
      - id: image
        run: echo "tag=$(scripts/e2e.sh --tag)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/e2e-image.tar
          key: e2e-image-${{ steps.image.outputs.tag }}
      - if: steps.cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/e2e-image.tar
      - if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/e2e.sh --build && docker save -o /tmp/e2e-image.tar "${{ steps.image.outputs.tag }}"
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/e2e-image.tar
          key: e2e-image-${{ steps.image.outputs.tag }}
      - run: npm run e2e
      # The videos of each test, and of a failure its trace and the screenshot diffs; the HTML report.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-recordings
          path: |
            test-results/
            playwright-report/
          retention-days: 14
