# CI for your Skill Atlas repository: the typecheck, the tests, the CLI itself and the UI e2e tests, on every push
# and pull request, on a clean machine. A pull request is ready when this is green.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The real CLI on the fixture repository, as a user would run it: it must exit 0.
      - name: Smoke test
        run: |
          ./skill-atlas help
          ./skill-atlas scan ./fixture
      # The web view on the fixture repository: the page must list its skills.
      - name: Smoke test, web view
        run: |
          ./skill-atlas serve --port 4321 &
          for i in $(seq 50); do curl -fs -o /dev/null http://127.0.0.1:4321/ && break; sleep 0.1; done
          curl -fsS 'http://127.0.0.1:4321/?repo=./fixture' | grep -F 'fixture</a> · 4 skills'
          kill %1
  # The UI e2e tests, in the image of tests/e2e/Dockerfile (scripts/e2e.sh): the screenshots of the key
  # moments must match tests/e2e/screenshots/ to the pixel. Every run keeps its recordings.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run e2e
        env:
          # The organization scan, on real GitHub, needs a personal token: CI's own runs out of code
          # search (429). Without the secret, that test is skipped.
          GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
      # The videos of each test, and of a failure its trace and the screenshot diffs; the HTML report.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-recordings
          path: |
            test-results/
            playwright-report/
          retention-days: 14
